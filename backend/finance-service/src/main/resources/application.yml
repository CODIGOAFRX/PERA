server.port: ${SERVER_PORT:8084}
spring:
  application.name: finance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pera_finance}
    username: ${DB_USER:pera}
    password: ${DB_PASSWORD:pera_dev_password}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
pera.jwt.secret: ${PERA_JWT_SECRET:change-me-development-secret-at-least-32-bytes}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
springdoc.swagger-ui.path: /swagger-ui.html
