server.port: ${SERVER_PORT:8084}
spring:
  application.name: finance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pera_finance}
    username: ${DB_USER:pera}
    password: ${DB_PASSWORD:pera_dev_password}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
pera.jwt.secret: ${PERA_JWT_SECRET:change-me-development-secret-at-least-32-bytes}
pera.internal.service-key: ${PERA_INTERNAL_SERVICE_KEY:pera-local-internal-service-key-change-me}
pera.services.sales-url: ${SALES_SERVICE_URL:http://localhost:8083}
pera.services.activity-url: ${ACTIVITY_SERVICE_URL:http://localhost:8086}
pera.services.master-data-url: ${MASTER_DATA_SERVICE_URL:http://localhost:8082}
pera.services.operations-url: ${OPERATIONS_SERVICE_URL:http://localhost:8085}
# Zona para numerar tickets por año y agrupar ventas por día y hora en el TPV.
pera.pos.time-zone: ${PERA_POS_TIME_ZONE:Europe/Madrid}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
springdoc.swagger-ui.path: /swagger-ui.html
