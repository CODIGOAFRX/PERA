server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: operations-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pera_operations}
    username: ${DB_USER:pera}
    password: ${DB_PASSWORD:pera_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${PERA_SHIPMENT_DOCUMENT_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${PERA_SHIPMENT_DOCUMENT_MULTIPART_MAX_REQUEST_SIZE:11MB}

pera.jwt.secret: ${PERA_JWT_SECRET:change-me-development-secret-at-least-32-bytes}
pera.shipment-document:
  storage-root: ${PERA_SHIPMENT_DOCUMENT_STORAGE_ROOT:.runtime/shipment-documents}
  max-bytes: ${PERA_SHIPMENT_DOCUMENT_MAX_BYTES:10485760}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

springdoc.swagger-ui.path: /swagger-ui.html
