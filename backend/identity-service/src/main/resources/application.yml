server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pera_identity}
    username: ${DB_USER:pera}
    password: ${DB_PASSWORD:pera_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

pera:
  jwt:
    secret: ${PERA_JWT_SECRET:change-me-development-secret-at-least-32-bytes}
    issuer: ${PERA_JWT_ISSUER:pera-erp}
    ttl: ${PERA_JWT_TTL:PT8H}
  bootstrap:
    admin-password: ${PERA_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
