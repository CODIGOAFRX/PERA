name: pera-erp

x-service-common: &service-common
  restart: unless-stopped
  networks: [pera-network]
  environment: &service-environment
    DB_USER: ${POSTGRES_USER:-pera}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-pera_dev_password}
    PERA_JWT_SECRET: ${PERA_JWT_SECRET:-change-me-development-secret-at-least-32-bytes}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pera_dev_password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pera-network]

  identity-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: identity-service }
    environment:
      <<: *service-environment
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/pera_identity
      PERA_BOOTSTRAP_ADMIN_PASSWORD: ${PERA_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
    ports: ["8081:8081"]

  master-data-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: master-data-service }
    environment:
      <<: *service-environment
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/pera_master_data
    ports: ["8082:8082"]

  sales-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: sales-service }
    environment:
      <<: *service-environment
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/pera_sales
    ports: ["8083:8083"]

  finance-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: finance-service }
    environment:
      <<: *service-environment
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/pera_finance
    ports: ["8084:8084"]

  api-gateway:
    restart: unless-stopped
    networks: [pera-network]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: api-gateway }
    environment:
      SERVER_PORT: 8080
      PERA_JWT_SECRET: ${PERA_JWT_SECRET:-change-me-development-secret-at-least-32-bytes}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MASTER_DATA_SERVICE_URL: http://master-data-service:8082
      SALES_SERVICE_URL: http://sales-service:8083
      FINANCE_SERVICE_URL: http://finance-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - identity-service
      - master-data-service
      - sales-service
      - finance-service
    ports: ["8080:8080"]

volumes:
  postgres-data:

networks:
  pera-network:
    driver: bridge
